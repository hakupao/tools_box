<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- DataForge Studio 应用图标：2×2 四格工具，背景透明。改完运行 scripts/build_icon.py 重新生成 favicon.ico。 -->
