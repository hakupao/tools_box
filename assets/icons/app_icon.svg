  <rect x="156" y="44" width="23" height="54" rx="6" fill="#FFFFFF"/>
  <rect x="191" y="44" width="23" height="54" rx="6" fill="#FFFFFF"/>

  <circle cx="185" cy="185" r="10" fill="#FFFFFF"/>
